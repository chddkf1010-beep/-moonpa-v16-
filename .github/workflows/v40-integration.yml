name: v40 integration phase 1
on:
  push:
    branches: [integration/v40-web-phase1]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: |
          python -m compileall -q engine
          node --check management.js
          node --check ledger-ui.js
          node --check game.js
          node --check group-engine.mjs
          node --check arena-ui.mjs
      - name: Verify mission retirement and preservation
        run: |
          PYTHONPATH=engine python -m unittest discover -s tests -p test_v40_unification.py -v
          PYTHONPATH=engine python -m unittest discover -s tests -p test_v40_incoming.py -v
          PYTHONPATH=engine python -m unittest discover -s tests -p test_v40_player_ledger.py -v
          PYTHONPATH=engine python -m unittest discover -s tests -p test_v40_facility_growth.py -v
          PYTHONPATH=engine python -m unittest discover -s tests -p test_v40_combat_config.py -v
          PYTHONPATH=engine python -m unittest discover -s tests -p test_v40_territory.py -v
          PYTHONPATH=engine python -m unittest discover -s tests -p test_ai_sect_tactics.py -v
          node --test tests/test_group_engine.mjs tests/test_v40_combat.mjs tests/test_v40_doctrine_refinement.mjs
          PYTHONPATH=engine python -m unittest discover -s tests -p test_training_focus_v112.py -v
          PYTHONPATH=engine python -m unittest discover -s tests -p test_seller_bargaining.py -v
          PYTHONPATH=engine python -m unittest discover -s tests -p test_names_preferences.py -v
          PYTHONPATH=engine python -m unittest discover -s tests -p test_portrait_diversity.py -v
