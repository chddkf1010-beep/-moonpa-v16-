name: Elite mission and jiyeon regression
on:
  push:
    branches: [feat/elite-kiyun-v1]
  pull_request:
jobs:
  elite-kiyun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all gameplay tests
        run: PYTHONPATH=engine python -m unittest discover -s tests -v
      - name: Simulate ten seasons across 32 sects
        run: PYTHONPATH=engine python tools/check_long_mission_10season.py
      - name: Check browser JavaScript syntax
        run: |
          node --check management.js
          node --check game.js
          node --check engine-worker.mjs
