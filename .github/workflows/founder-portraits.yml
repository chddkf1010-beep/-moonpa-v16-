name: Founder portrait mapping verification
on:
  push:
    branches: [feat/individual-founder-portraits]
  pull_request:
jobs:
  founder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/export_founder_roster.py --seed 16
      - run: python -m unittest discover -s tests -v
      - run: |
          node --check game.js
          node --check engine-worker.mjs
