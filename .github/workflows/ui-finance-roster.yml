name: Real browser test for finance and roster UI
on:
  pull_request:
    paths:
      - 'management.js'
      - 'ledger-ui.js'
      - 'roster-ui.js'
      - 'management-dashboard.css'
      - 'index.html'
      - 'tools/test_finance_roster_browser.cjs'
      - '.github/workflows/ui-finance-roster.yml'
  push:
    branches: [feat/monthly-finance-roster-ux, main]
    paths:
      - 'management.js'
      - 'ledger-ui.js'
      - 'roster-ui.js'
      - 'management-dashboard.css'
      - 'index.html'
      - 'tools/test_finance_roster_browser.cjs'
      - '.github/workflows/ui-finance-roster.yml'
jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot dependencies
        run: |
          npm install --no-save playwright@1.56.1
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify UI scripts and legacy compatibility checks
        run: |
          node --check management.js
          node --check ledger-ui.js
          node --check roster-ui.js
          node --test tests/test_management_dashboard_ui.mjs
          node --test tests/test_member_trait_display.mjs
          node --test tests/test_world_map_ui.mjs
          node --test tests/test_save_manager.mjs
      - name: Run actual in-browser game and capture UI
        run: |
          python3 -m http.server 8765 >/tmp/moonpa-ui-server.log 2>&1 &
          sleep 2
          node tools/test_finance_roster_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-finance-roster-screenshots
          path: docs/ui-finance-roster-captures/
          if-no-files-found: warn
