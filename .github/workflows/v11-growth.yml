name: V11 primary-eight cultivation, historic growth and training planning
on:
  push:
    branches: [feat/v11-growth-portrait-integrated]
  pull_request:
jobs:
  eight-growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Growth UI and all JS syntax
        run: |
          node --check growth-ui.js
          node --check management.js
          node --check market-ui.js
          node --check prebattle-ui.js
          node --check honors-ui.js
          node --check game.js
          node --check engine-worker.mjs
          node --test tests/test_save_manager.mjs tests/test_market_filters_v10.mjs tests/test_facility_art_v1.mjs
      - name: Full Python + new weekly growth regression
        run: PYTHONPATH=engine python -m unittest discover -s tests -v
      - name: 32 sects x 10 seasons economy and progression
        run: PYTHONPATH=engine python tools/check_long_mission_10season.py
      - name: Validate arena only if files intentionally change
        run: |
          git fetch origin main
          if git diff --quiet "$(git merge-base origin/main HEAD)" HEAD -- moonpa-arena.html group-engine.mjs arena-ui.mjs; then
            echo "Independent arena unchanged"
          else
            node --test tests/test_group_engine.mjs tests/test_battle_report.mjs
          fi
