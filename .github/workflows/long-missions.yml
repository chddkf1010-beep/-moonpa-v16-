name: Long expedition regression
on:
  push:
    branches: [feat/long-expeditions-v1]
  pull_request:
jobs:
  long-missions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run existing and expedition tests
        run: PYTHONPATH=engine python -m unittest discover -s tests -v
      - name: Check browser scripts
        run: |
          node --check management.js
          node --check game.js
          node --check engine-worker.mjs
