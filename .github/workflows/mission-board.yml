name: Mission board and economy regression
on:
  push:
    branches: [feat/mission-board-v1, main]
  pull_request:
jobs:
  mission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all Python regression tests
        run: PYTHONPATH=engine python -m unittest discover -s tests -v
      - name: Validate browser JavaScript syntax
        run: |
          node --check management.js
          node --check game.js
          node --check engine-worker.mjs
