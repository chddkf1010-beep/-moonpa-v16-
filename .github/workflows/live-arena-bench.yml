name: Live arena bench, stats and substitution
on:
  pull_request:
  push:
    branches: [feat/live-arena-bench-details]
jobs:
  live-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify JS module syntax
        run: |
          node --check arena-ui.mjs
          node --check arena-bench.mjs
          node --check group-engine.mjs
          node --check engine-worker.mjs
          node --check game.js
      - name: Existing combat and bench JavaScript tests
        run: node --test tests/test_arena_bench.mjs tests/test_group_engine.mjs tests/test_weekly_battle_watch.mjs tests/test_battle_report.mjs
      - name: Campaign and save regression
        run: PYTHONPATH=engine python -m unittest discover -s tests -v
      - name: Full 32-sect economy regression
        run: PYTHONPATH=engine python tools/check_long_mission_10season.py
