name: V6 treasury, estate ROI and growth regression
on:
  push:
    branches: [feat/v6-treasury-growth-balance]
  pull_request:
jobs:
  economy-and-saves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full Python regression
        run: PYTHONPATH=engine python -m unittest discover -s tests -v
      - name: 32 sects 10-season cash and growth simulation
        run: PYTHONPATH=engine python tools/check_long_mission_10season.py
      - name: JavaScript syntax and save UI tests
        run: |
          node --check management.js
          node --check game.js
          node --check save-manager.js
          node --check engine-worker.mjs
          node --test tests/test_save_manager.mjs
