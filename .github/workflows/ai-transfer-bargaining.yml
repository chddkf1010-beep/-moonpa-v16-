name: AI sect bargaining and transfer integrity
on:
  push:
    branches: [feat/ai-transfer-bargaining]
  pull_request:
jobs:
  bargaining:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax and market UI
        run: |
          node --check management.js
          node --check market-negotiation-ui.js
          node --check engine-worker.mjs
          node --check game.js
          node --test tests/test_seller_negotiation_ui.mjs tests/test_market_filters_v10.mjs tests/test_save_manager.mjs
      - name: Complete Python campaign and save regressions
        run: PYTHONPATH=engine python -m unittest discover -s tests -v
      - name: 32-sect ten-season economy
        run: PYTHONPATH=engine python tools/check_long_mission_10season.py

  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and Korean fonts
        run: |
          npm install --no-save playwright@1.56.1
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Test actual sect-to-sect bargaining and signing
        run: |
          python3 -m http.server 8765 >/tmp/transfer-market-server.log 2>&1 &
          sleep 2
          node tools/test_bargaining_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-rival-negotiation-screenshots
          path: docs/negotiation-captures/
          if-no-files-found: warn
