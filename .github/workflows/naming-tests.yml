name: Wuxia naming and recruitment regression tests

on:
  push:
    branches:
      - feat/sect-names-and-hidden-recruitment
  pull_request:

jobs:
  naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check browser JavaScript syntax
        run: |
          node --check game.js
          node --check engine-worker.mjs
      - name: Run Python integration tests
        run: PYTHONPATH=engine python -m unittest discover -s tests -v
