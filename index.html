<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="style.css?v=trait-delta2-watch1-settings1">
<link rel="stylesheet" href="prebattle.css?v=20261121-v8prebattle1">

<header><div><h1>문파 키우기</h1><p id="meta"></p></div>
<div class="save-header"><span id="phase">문파 운영</span><small id="save-status" aria-live="polite">기록 확인 중…</small>
<button id="open-arena-tactics" type="button" title="전체 문파원으로 점령전·방어전 전술을 각각 설정·저장합니다.">연무장 · 점령/방어 전술 저장</button>
<button id="save-menu" type="button" disabled>설정</button></div></header>
<main><p id="error" role="alert"></p><section id="screen"></section></main>
<dialog id="save-dialog" aria-labelledby="save-title">
  <div class="save-dialog-head"><h2 id="save-title">게임 설정</h2><button id="save-close" type="button" autofocus>닫기</button></div>
  <section class="save-section" aria-labelledby="save-browser-title">
    <h3 id="save-browser-title">저장 · 불러오기</h3>
    <div class="save-slot save-single">
      <div><strong>현재 자동저장</strong><small id="save-auto-detail"></small></div>
      <button id="save-now" type="button">지금 저장</button>
    </div>
    <div id="save-slots"></div>
    <div class="save-slot save-single" id="save-recovery-row" hidden>
      <div><strong>새 게임 시작 전 기록</strong><small id="save-recovery-detail"></small></div>
      <button id="save-recover" type="button">불러오기</button>
    </div>
  </section>
  <section class="save-section" aria-labelledby="save-file-title">
    <h3 id="save-file-title">세이브 파일</h3>
    <p class="muted-copy">파일로 내려받아 다른 브라우저에서도 이어 할 수 있어요.</p>
    <div class="controls"><button id="save-export" type="button">내보내기</button>
    <button id="save-import" type="button">가져오기</button></div>
    <input id="save-file" type="file" accept=".json,application/json" hidden>
  </section>
  <section class="save-section" aria-labelledby="save-game-title">
    <h3 id="save-game-title">새 게임</h3>
    <p class="muted-copy">새 문파를 창설하기 전에 현재 문파 기록 1개를 따로 보관해요.</p>
    <button id="save-reset" type="button">새 게임 시작</button>
  </section>
  <p id="save-feedback" role="status" aria-live="polite"></p>
</dialog>

<script src="save-manager.js?v=settings1-month1"></script>
<script src="world-map.js?v=20261122-worldmap1-terrain6"></script>
<script src="game.js?v=full-roster-dual-presets2"></script>
</html>
