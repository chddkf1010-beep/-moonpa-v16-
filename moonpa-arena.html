<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>문파 키우기 · 연무장</title><style>:root{color-scheme:dark;--bg:#101714;--panel:#19221d;--card:#202c25;--line:#354539;--ink:#f0eee1;--muted:#b5bcac;--gold:#ebc580;--mint:#91d3ab;--red:#ff9788}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0,#24382c,transparent 44%),var(--bg);color:var(--ink);font:15px system-ui,sans-serif}button,select{font:inherit;color:inherit;background:#27352c;border:1px solid #496052;border-radius:6px;padding:.42rem .63rem}button{cursor:pointer}button:hover:not(:disabled),button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}:focus-visible{outline:2px solid #ffd284;outline-offset:3px}button:disabled,select:disabled{opacity:.5;cursor:default}small{color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-family:Georgia,serif;font-size:clamp(2.45rem,5vw,3.8rem);letter-spacing:-.05em}h2{font-size:1.12rem}h3{font-size:.92rem}.bar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:1rem max(4vw,1rem);background:#101a15}.brand{color:var(--gold);text-decoration:none;font-size:1.32rem;font-weight:750}.brand span{color:var(--ink);padding-left:.35rem}.caption,.overline{color:var(--muted);font-size:.78rem}.overline{color:var(--gold);letter-spacing:.18em;margin-bottom:.15rem}main{max-width:1550px;margin:auto;padding:1.25rem max(3vw,1rem) 2rem}.heading,.section-head,.scorebar,.battle-tools,.log-heading{display:flex;justify-content:space-between;align-items:center;gap:.65rem}.heading{margin-bottom:1rem}.pill{border:1px solid #5b674d;border-radius:99px;padding:.4rem .75rem;color:var(--gold);font-size:.79rem}.preparation,.battle-board,.side{background:var(--panel);border:1px solid var(--line);border-radius:11px}.preparation{padding:.9rem 1rem}.section-head{margin-bottom:.7rem}.field-controls,.battle-tools>div,.modes>div{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}.field-controls label{display:flex;align-items:center;gap:.35rem}.prep-grid{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(16rem,1fr);gap:1rem}.line{display:flex;align-items:center;gap:.38rem;margin:.32rem 0;flex-wrap:wrap}.line-label{min-width:5.3rem;color:var(--muted);font-size:.83rem}.slot{padding:.3rem .43rem;display:inline-flex;align-items:center;gap:.28rem;min-height:36px}.slot b{color:var(--gold)}.slot.empty{border-style:dashed;color:var(--muted);min-width:4.5rem}.orders{background:#131e18;border-radius:7px;padding:.58rem .72rem}.leaders{display:flex;gap:.6rem}.leaders label{display:flex;align-items:center;gap:.35rem}.orders>small{display:block;margin:.36rem 0}.kit-actions{display:flex;gap:.32rem;margin:.32rem 0 .55rem}.kit-actions select{width:33.33%;min-width:0;font-size:.84rem}.primary{background:var(--gold);border-color:var(--gold);color:#231c13;padding:.46rem .72rem;font-weight:750;width:100%;display:flex;justify-content:space-between}.primary:hover:not(:disabled){color:#231c13;background:#ffdb9b}#warning:not(:empty){margin-top:.35rem;color:var(--red);font-size:.83rem}.match{margin-top:1rem;display:grid;grid-template-columns:minmax(0,3.5fr) minmax(230px,1fr);gap:.8rem;align-items:stretch}.battle-board{overflow:hidden}.scorebar{padding:.58rem .9rem;text-align:center}.scorebar small{display:block;margin-top:.16rem}.scorebar #clock{font:700 1.55rem ui-monospace,monospace;color:var(--gold)}.allied{color:var(--mint)}.enemy{color:var(--red)}.canvas-frame{position:relative;background:#222d24}canvas{width:100%;display:block;aspect-ratio:900/430}#alarm{position:absolute;top:12%;left:50%;transform:translateX(-50%);padding:.68rem 1.2rem;border:1px solid #ff9987;border-radius:6px;background:#571c17ec;color:#ffe8c9;font-size:clamp(.85rem,2vw,1.25rem);font-weight:850;white-space:nowrap;box-shadow:0 0 28px #a9312790;pointer-events:none}.battle-tools{padding:.54rem .7rem;flex-wrap:wrap;border-top:1px solid var(--line)}.battle-tools span{color:var(--muted);font-size:.84rem}.side{padding:.75rem;display:flex;flex-direction:column;min-width:0}.log-heading{border-bottom:1px solid var(--line);padding-bottom:.62rem}.skill time{color:#d8a7ef}.log-heading span{color:var(--mint);font-size:.78rem}#log{height:clamp(210px,25vw,385px);overflow:auto;padding:.25rem .1rem .35rem}#log p{padding:.44rem .16rem;border-bottom:1px solid #344338;font-size:.82rem;line-height:1.45}#log time{font: .76rem ui-monospace,monospace;color:var(--gold);margin-right:.45rem}#log .break,#log .infiltrate,#log .leader{color:#ffae9d}#result{padding:.6rem;background:#30271d;border:1px solid #6d5537;border-radius:6px;margin:.25rem 0 .5rem;font-size:.84rem}#result p{margin:.25rem 0}.modes{margin-top:auto;border-top:1px solid var(--line);padding-top:.55rem}.modes h3{margin-bottom:.4rem}.modes button{font-size:.79rem}#commands{padding:.65rem;border-top:1px solid var(--line);background:#253129}#commands p{margin:.25rem 0 .5rem}#commands button{margin:0 .3rem .3rem 0}[hidden]{display:none!important}
@media(max-width:850px){.prep-grid,.match{grid-template-columns:1fr}.match{gap:.6rem}#log{height:160px}.side{min-height:250px}}
@media(max-width:520px){.heading,.section-head{align-items:flex-start}.section-head{flex-direction:column}.caption{display:none}main{padding-inline:.65rem}.line-label{min-width:4rem}.slot{font-size:.76rem}.scorebar{font-size:.82rem}}
.art-attack{--art-color:#ff9d78}.art-defense{--art-color:#9dccff}.art-heal{--art-color:#a8efaf}.art-control{--art-color:#d6b0ff}.art-formation{--art-color:#9ee8eb}
.art-picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem;margin:.4rem 0}
.art-choice{border:1px solid var(--line);border-top:2px solid var(--art-color);border-radius:6px;padding:.42rem;min-width:0}
.art-choice select{width:100%;font-size:.84rem;padding:.25rem}.art-choice small{display:block;margin:.35rem 0}.art-choice p,.enemy-arts p{font-size:.8rem;line-height:1.42}
.enemy-arts{margin:.45rem 0;color:var(--muted);font-size:.84rem}.enemy-arts p{margin:.35rem 0}.enemy-arts b,#log p[class^=art-],#log p[class^=art-] time{color:var(--art-color)}
#art-cutins{position:absolute;inset:0;pointer-events:none;z-index:2}
#art-cutins.flash{box-shadow:inset 0 0 50px 12px #080b09b0}
.cutin{position:absolute;top:3%;max-width:48%;display:flex;flex-wrap:wrap;gap:.25rem;animation:ink-slide .22s ease-out}
.cutin.friend{left:2%}.cutin.foe{right:2%;justify-content:flex-end}
.cutin span{display:block;padding:.35rem .65rem;color:var(--art-color);background:linear-gradient(100deg,#121514ed,#25231cda);border-block:1px solid var(--art-color);font:800 clamp(.7rem,1.75vw,1.18rem) Georgia,serif}
.cutin small{font:500 .67em system-ui,sans-serif;color:#eee2c7}#alarm{z-index:3;top:18%}
@keyframes ink-slide{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0)}}
@media(prefers-reduced-motion:reduce){.cutin{animation:none}}
#team-controls{margin-bottom:.65rem;padding:.5rem .65rem;background:#141e19;border-radius:7px}
#matchup-info{display:block;margin-top:.35rem}.log-filter{display:flex;gap:.5rem;align-items:center;margin-top:.45rem;font-size:.78rem}
#guard-status{padding:.42rem .68rem;color:#f0c389;font-size:.8rem;border-top:1px solid var(--line);min-height:2rem}
.result-actions{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.55rem}.result-actions button{font-size:.78rem}
#log .personal{color:#d6e4d7}#log .gap{color:#ffae83}
 .command-preview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem;margin:.55rem 0}
.command-preview article{border:1px solid var(--line);border-radius:6px;padding:.42rem .5rem;font-size:.78rem}
.command-preview h3,.command-preview p b{color:var(--gold)}.command-preview strong{display:block;margin:.22rem 0}
.command-preview p,.command-links{margin-top:.23rem;line-height:1.4}.command-links{padding-left:1rem;color:var(--muted)}
#lead-diff:not(:empty){font-size:.78rem;color:var(--mint);margin:.35rem 0}
.line .slot[data-unit]{position:relative;display:inline-block;width:76px;height:92px;padding:0;overflow:hidden;vertical-align:middle;border:2px solid #819783;isolation:isolate}
.line .slot[data-unit]>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%}
.line .slot[data-unit]>span{position:absolute;inset:auto 0 0;padding:15px 3px 4px;background:linear-gradient(transparent,#121a16 72%);font-size:.76rem;font-weight:700;text-align:center;line-height:1.2}
.line .slot[data-unit] b{display:block;color:#dbca9f;font-size:.62rem;font-weight:500}
.line .slot[data-unit][data-command=captain]{border-color:#f4c76c;box-shadow:0 0 8px #f4c76c66}
.line .slot[data-unit][data-command=deputy]{border-color:#7dc9ff}
.line .slot[data-unit][aria-pressed=true]{outline:2px solid #ffd284;outline-offset:2px}
@media(max-width:560px){.line .slot[data-unit]{width:58px;height:72px}.line .slot[data-unit]>span{font-size:.66rem}}
.slot-name{font-style:normal}.slot[aria-pressed="true"]{outline:2px solid #e9be66}.modes[hidden],#team-controls[hidden]{display:none}#field.deployment{touch-action:none;cursor:crosshair}#deployment-help{margin:.6rem 0;color:#dfd6be}#deployment-status{color:#ffe095}
/* Live campaign reserve bench and fighter stat modal. */
.arena-member-tile{display:inline-flex;flex-direction:column;align-items:center;gap:3px;vertical-align:top;flex:none}
.arena-member-tile.is-swap-target .slot{outline:2px solid var(--gold);outline-offset:2px}
.arena-member-actions{width:100%;display:flex;gap:3px}
.arena-member-actions button{flex:1;padding:3px 2px;font-size:.69rem;border-color:#77694d;background:#202c24}
.arena-bench{margin:1rem 0 .2rem;border-top:1px solid #47604d;padding-top:.7rem}
.arena-bench-heading{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:.6rem}
.arena-bench-heading h3{color:var(--gold);font-size:.98rem}
.arena-bench-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:.46rem;max-height:290px;overflow-y:auto;padding:2px 4px 6px 1px}
.arena-bench-card{display:flex;flex-direction:column;gap:4px;min-width:0;padding:5px;border:1px solid #53654f;border-radius:6px;background:#121b17}
.arena-bench-card.is-pending{border-color:var(--gold);box-shadow:inset 0 0 0 1px #d6af68}
.arena-bench-card .arena-bench-portrait{position:relative;display:block;width:100%;height:78px;padding:0;border:1px solid #506759;overflow:hidden}
.arena-bench-portrait img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 16%}
.arena-bench-portrait span{position:absolute;inset:auto 0 0;padding:14px 2px 3px;background:linear-gradient(transparent,#121a16 74%);font-weight:700;font-size:.71rem;text-align:center}
.arena-bench-card>small{text-align:center;font-size:.65rem;white-space:nowrap}
.arena-bench-join{width:100%;padding:5px 3px;font-size:.73rem;background:#344536;border-color:#6c8b71}
.arena-bench-hint,.arena-bench-status{margin:.6rem 0 0;font-size:.76rem;color:#c3cab8;line-height:1.5}
.arena-bench-status{color:#f0ce8c;font-weight:650}
#fighter-stats-dialog{width:min(520px,calc(100% - 20px));max-height:min(88vh,830px);padding:20px;
  overflow:auto;background:#19231d;color:var(--ink);border:1px solid #a58756;border-radius:11px;box-shadow:0 28px 80px #000a}
#fighter-stats-dialog::backdrop{background:#020702c5}
.fighter-stats-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.fighter-stats-top strong{color:var(--gold)}
.fighter-stats-head{display:grid;grid-template-columns:110px minmax(0,1fr);gap:15px;align-items:center;margin-bottom:15px}
.fighter-stats-art{width:110px;height:133px;overflow:hidden;border:1px solid #b18f59;border-radius:7px}
.fighter-stats-art img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
.fighter-stats-head h2{font-size:1.45rem;color:#ead1a4;margin:4px 0}
.fighter-stats-head p{font-size:.78rem;color:var(--gold)}
.fighter-stat-power{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
.fighter-stat-power strong{font-size:.85rem;background:#26372b;padding:6px;border:1px solid #49634a;border-radius:4px}
#fighter-stats-content>h3{font-size:.97rem;margin-bottom:12px}
.fighter-stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fighter-stat{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:.84rem}
.fighter-stat b{font-variant-numeric:tabular-nums}
.fighter-stat i{grid-column:1/-1;display:block;height:6px;border-radius:5px;background:#86b892;box-shadow:0 0 0 1px #62755d;max-width:100%}
.fighter-stats-contract{margin-top:15px;color:#d9c6a6;font-size:.81rem}
.fighter-stats-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:18px}
.fighter-stats-actions button{font-size:.8rem}
.fighter-stats-actions .stats-primary{background:var(--gold);color:#181d17;font-weight:700}
@media(max-width:520px){.arena-bench-grid{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
  .arena-member-tile{width:58px}.arena-member-actions button{font-size:.61rem}
  .arena-bench-card .arena-bench-portrait{height:68px}
  .fighter-stats-head{grid-template-columns:92px 1fr}.fighter-stats-art{width:92px;height:112px}}
</style><link rel="stylesheet" href="battle-report.css?v=battlereport-1"></head>
<body><header class="bar"><a class="brand" href="./">門 <span>문파 키우기</span></a><span class="caption">전투 프로토타입 · 2D 전장</span></header>
<main><div class="heading"><div><p class="overline">문파 작전실</p><h1>연무장</h1></div><span id="mode-label" class="pill">단체전 · 자동 관전</span></div>
<section class="preparation" aria-labelledby="prep-title">
 <div class="section-head"><div><h2 id="prep-title">전투 준비</h2><small id="terrain-hint"></small></div><div class="field-controls">
 <label>전장 <select id="terrain"></select></label><label>작전 <select id="scenario"><option value="attack">점령전</option><option value="defense">방어전</option></select></label></div></div>
 <div id="team-controls"><div class="field-controls">
<label>아군 조합 <select id="player-preset"></select></label><label>상대 문파 <select id="opponent"></select></label>
</div><small id="matchup-info"></small></div><div class="prep-grid"><div id="formation"></div><div class="orders">
 <div class="leaders"><label>대장<select id="captain"></select></label><label>부대장<select id="deputy"></select></label></div>
 <div id="lead-note" class="command-preview"></div><p id="lead-diff" role="status"></p><div id="kit"></div><button id="deployment-jump" type="button">전장에서 배치</button> <button id="start" class="primary">전투 시작 <span>→</span></button><p id="warning" role="alert"></p></div></div>
</section>
<section class="match">
 <div class="battle-board"><div class="scorebar"><div class="allied"><b id="ally-name">청운문</b><small id="left-score"></small></div><div><span id="clock">00:00</span><small id="status">편성 대기</small></div><div class="enemy"><b id="enemy-name">당문</b><small id="right-score"></small></div></div>
 <p id="deployment-help">아군 문파원을 끌거나 선택한 뒤 아군 땅을 누르세요. 다른 문파원 위에 놓으면 자리를 교대합니다. <span id="deployment-status" role="status"></span></p>
 <div class="canvas-frame"><canvas id="field" width="900" height="430" role="img" aria-label="양측 문파 전투 화면"></canvas><div id="art-cutins" aria-hidden="true"></div><div id="alarm" hidden></div></div>
 <div class="battle-tools"><div><span>관전 속도</span> <button data-speed="1" aria-pressed="true">1×</button><button data-speed="2" aria-pressed="false">2×</button></div><div><button id="replay">재시작</button><button id="edit">진형 수정</button></div></div>
 <div id="guard-status" hidden></div><div id="commands" hidden></div></div>
 <aside class="side"><div class="log-heading"><h2>전투 기록</h2><span id="live">대기</span></div>
 <label class="log-filter">기록 범위 <select id="log-filter"><option value="major">핵심 사건</option><option value="personal">개인 무공</option><option value="all">전체</option></select></label><div id="log"><p>전투가 시작되면 핵심 사건이 기록됩니다.</p></div><div id="result" hidden></div>
 <div class="modes"><h3>전투 모드</h3><div><button data-mode="8" aria-pressed="true">8대8 단체전</button><button data-mode="10">10대10 승강전</button><button data-mode="1">1대1</button><button data-mode="3">3대3</button><button data-mode="5">5대5</button></div></div></aside>
</section></main>
<dialog id="fighter-stats-dialog" aria-labelledby="fighter-stats-title">
  <div class="fighter-stats-top"><strong id="fighter-stats-title">문파원 능력치</strong>
    <button type="button" id="fighter-stats-close" aria-label="능력치 창 닫기">닫기 ✕</button></div>
  <div id="fighter-stats-content"></div>
</dialog>
<div id="battle-report-overlay" class="br-overlay" hidden>
  <section class="br-dialog" role="dialog" aria-modal="true" aria-labelledby="br-title">
    <button id="br-close" class="br-close" type="button" aria-label="전투 성적표 닫기">✕</button>
    <div id="br-content" class="br-scroll"></div>
    <footer class="br-footer">
      <button id="br-field" type="button">전장 다시 보기</button>
      <div id="br-actions" class="result-actions"></div>
    </footer>
  </section>
</div>
<script type="module" src="arena-ui.mjs?v=bench-details1"></script>
</body></html>
