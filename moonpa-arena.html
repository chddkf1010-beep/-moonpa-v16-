<title>문파 키우기 · 연무장</title><style>:root{color-scheme:dark;--bg:#101714;--panel:#19221d;--card:#202c25;--line:#354539;--ink:#f0eee1;--muted:#b5bcac;--gold:#ebc580;--mint:#91d3ab;--red:#ff9788}

size:.83rem}.slot{padding:.3rem .43rem;display:inline-flex;align-items:center;gap:.28rem;min-height:36px}.slot b{color:var(--gold)}.slot.empty{border-style:dashed;color:var(--muted);min-width:4.5rem}.orders{background:#131e18;border-radius:7px;padding:.58rem .72rem}.leaders{display:flex;gap:.6rem}.leaders label{display:flex;align-items:center;gap:.35rem}.orders>small{display:block;margin:.36rem 0}.kit-actions{display:flex;gap:.32rem;margin:.32rem 0 .55rem}.kit-actions select{width:33.33%;min-width:0;font-size:.84rem}.primary{background:var(--gold);border-color:var(--gold);color:#231c13;padding:.46rem .72rem;font-weight:750;width:100%;display:flex;justify-content:space-between}.primary:hover:not(:disabled){color:#231c13;background:#ffdb9b}#warning:not(:empty){margin-top:.35rem;color:var(--red);font-size:.83rem}.match{margin-top:1rem;display:grid;grid-template-columns:minmax(0,3.5fr) minmax(230px,1fr);gap:.8rem;align-items:stretch}.battle-board{overflow:hidden}.scorebar{padding:.58rem .9rem;text-align:center}.scorebar small{display:block;margin-top:.16rem}.scorebar #clock{font:700 1.55rem ui-monospace,monospace;color:var(--gold)}.allied{color:var(--mint)}.enemy{color:var(--red)}.canvas-frame{position:relative;background:#222d24}canvas{width:100%;display:block;aspect-ratio:900/430}#alarm{position:absolute;top:12%;left:50%;transform:translateX(-50%);padding:.68rem 1.2rem;border:1px solid #ff9987;border-radius:6px;background:#571c17ec;color:#ffe8c9;font-size:clamp(.85rem,2vw,1.25rem);font-weight:850;white-space:nowrap;box-shadow:0 0 28px #a9312790;pointer-events:none}.battle-tools{padding:.54rem .7rem;flex-wrap:wrap;border-top:1px solid var(--line)}.battle-tools span{color:var(--muted);font-size:.84rem}.side{padding:.75rem;display:flex;flex-direction:column;min-width:0}.log-heading{border-bottom:1px solid var(--line);padding-bottom:.62rem}.skill time{color:#d8a7ef}.log-heading span{color:var(--mint);font-size:.78rem}#log{height:clamp(210px,25vw,385px);overflow:auto;padding:.25rem .1rem .35rem}#log p{padding:.44rem .16rem;border-bottom:1px solid #344338;font-size:.82rem;line-height:1.45}#log time{font: .76rem ui-monospace,monospace;color:var(--gold);margin-right:.45rem}#log .break,#log .infiltrate,#log .leader{color:#ffae9d}#result{padding:.6rem;background:#30271d;border:1px solid #6d5537;border-radius:6px;margin:.25rem 0 .5rem;font-size:.84rem}#result p{margin:.25rem 0}.modes{margin-top:auto;border-top:1px solid var(--line);padding-top:.55rem}.modes h3{margin-bottom:.4rem}.modes button{font-size:.79rem}#commands{padding:.65rem;border-top:1px solid var(--line);background:#253129}#commands p{margin:.25rem 0 .5rem}#commands button{margin:0 .3rem .3rem 0}[hidden]{display:none!important}

.art-attack{--art-color:#ff9d78}.art-defense{--art-color:#9dccff}.art-heal{--art-color:#a8efaf}.art-control{--art-color:#d6b0ff}.art-formation{--art-color:#9ee8eb}

.art-choice select{width:100%;font-size:.84rem;padding:.25rem}.art-choice small{display:block;margin:.35rem 0}.art-choice p,.enemy-arts p{font-size:.8rem;line-height:1.42}

<body><header class="bar"><a class="brand" href="./">門 <span>문파 키우기</span></a><span class="caption">전투 프로토타입 · 2D 전장</span></header>
<main><div class="heading"><div><p class="overline">문파 작전실</p><h1>연무장</h1></div><span id="mode-label" class="pill">단체전 · 자동 관전</span></div>
<section class="preparation" aria-labelledby="prep-title">
 <div class="section-head"><div><h2 id="prep-title">전투 준비</h2><small id="terrain-hint"></small></div><div class="field-controls">
 <label>전장 <select id="terrain"></select></label><label>작전 <select id="scenario"><option value="attack">점령전</option><option value="defense">방어전</option></select></label></div></div>
 <div id="team-controls"><div class="field-controls">
<label>아군 조합 <select id="player-preset"></select></label><label>상대 문파 <select id="opponent"></select></label>
</div><small id="matchup-info"></small></div><div class="prep-grid"><div id="formation"></div><div class="orders">
 <div class="leaders"><label>대장<select id="captain"></select></label><label>부대장<select id="deputy"></select></label></div>
 <div id="lead-note" class="command-preview"></div><p id="lead-diff" role="status"></p><div id="kit"></div><button id="start" class="primary">전투 시작 <span>→</span></button><p id="warning" role="alert"></p></div></div>
</section>
<section class="match">
 <div class="battle-board"><div class="scorebar"><div class="allied"><b>청운문</b><small id="left-score"></small></div><div><span id="clock">00:00</span><small id="status">편성 대기</small></div><div class="enemy"><b id="enemy-name">당문</b><small id="right-score"></small></div></div>
 <div class="canvas-frame"><canvas id="field" width="900" height="430" role="img" aria-label="양측 문파 전투 화면"></canvas><div id="art-cutins" aria-hidden="true"></div><div id="alarm" hidden></div></div>
 <div class="battle-tools"><div><span>관전 속도</span> <button data-speed="1" aria-pressed="true">1×</button><button data-speed="2" aria-pressed="false">2×</button></div><div><button id="replay">재시작</button><button id="edit">진형 수정</button></div></div>
 <div id="guard-status" hidden></div><div id="commands" hidden></div></div>
 <aside class="side"><div class="log-heading"><h2>전투 기록</h2><span id="live">대기</span></div>
 <label class="log-filter">기록 범위 <select id="log-filter"><option value="major">핵심 사건</option><option value="personal">개인 무공</option><option value="all">전체</option></select></label><div id="log"><p>전투가 시작되면 핵심 사건이 기록됩니다.</p></div><div id="result" hidden></div>
 <div class="modes"><h3>전투 모드</h3><div><button data-mode="8" aria-pressed="true">단체전</button><button data-mode="1">1대1</button><button data-mode="3">3대3</button><button data-mode="5">5대5</button></div></div></aside>
</section></main><script>const Arena = (() => {
  const terrains = {
    field:{name:'청운 평야',hint:'넓은 전열 · 세 방면에서 충돌',front:5,back:3,y:[.20,.35,.50,.65,.80],gap:1},
    gate:{name:'흑석 관문',hint:'좁은 관문 · 전열 3칸',front:3,back:5,y:[.34,.50,.66],gap:.65},
    river:{name:'백로 나루',hint:'두 나루로 갈라지는 전선 · 전열 4칸',front:4,back:4,y:[.25,.37,.63,.75],gap:1.15}
  };
  const roles = {
    guard:{name:'수호',icon:'盾',hp:208,power:17,range:42,pace:20,agility:4},
    blade:{name:'무인',icon:'劍',hp:178,power:24,range:43,pace:28,agility:7},
    bow:{name:'사수',icon:'弓',hp:110,power:34,range:270,pace:15,agility:9},
    hex:{name:'주술',icon:'符',hp:108,power:26,range:226,pace:15,agility:6},
    heal:{name:'치유',icon:'藥',hp:112,power:20,range:240,pace:15,agility:5},
    dash:{name:'암살',icon:'影',hp:121,power:34,range:42,pace:34,agility:11}
  };
  const skills = {
    sword:{name:'파군격',kind:'strike',aim:'foe',hint:'강한 근접 공격',factor:1.18},
    arrow:{name:'관월시',kind:'arrow',aim:'foe',hint:'원거리 관통 사격',factor:1.08},
    curse:{name:'쇄맥부',kind:'hex',aim:'foe',hint:'방어 약화와 행동 둔화',factor:.65},
    mend:{name:'회춘결',kind:'heal',aim:'ally',hint:'아군 체력 회복',factor:1},
    taunt:{name:'철벽 도발',kind:'taunt',aim:'foe',hint:'주변 적이 잠시 수호자를 공격',factor:0},
    ambush:{name:'그림자 기습',kind:'ambush',aim:'foe',hint:'후열의 시전과 사격을 끊음',factor:1.12},
    ward:{name:'호신진',kind:'shield',aim:'ally',hint:'아군 보호막',factor:1},
    link:{name:'합격술',kind:'link',aim:'foe',hint:'아군이 남긴 표식에 추가 피해',factor:.89}
  };
  const roster=[
    ['진무혁','blade'],['철무진','guard'],['백소연','heal'],['서린','hex'],
    ['설궁','bow'],['흑영','dash'],['도윤','guard'],['연비','bow']
  ].map(([name,role],id)=>({id,name,role}));
  const rivals=[
    ['적무결','blade'],['석건','guard'],['월하','heal'],['적련','hex'],
    ['한조','bow'],['야귀','dash'],['우강','guard'],['유설','bow']
  ].map(([name,role],id)=>({id:id+20,name,role}));
  const playerPresets = {
    balanced:{name:'균형 편성',roleList:null,hint:'수호 2 · 사수 2 · 치유 1 · 암살 1'},
    hold:{name:'수호·치유 중심',roleList:['guard','guard','heal','hex','bow','blade','guard','heal'],hint:'수호 3 · 치유 2 · 암살 없음'},
    raid:{name:'사수·암살 중심',roleList:['blade','guard','heal','hex','bow','dash','dash','bow'],hint:'수호 1 · 사수 2 · 암살 2'}
  };
  const foesPresets = {
    tang:{name:'당문',roleList:['dash','guard','heal','hex','bow','dash','bow','bow'],arts:['rain','poison']},
    shaolin:{name:'소림',roleList:['guard','guard','heal','hex','bow','blade','guard','heal'],arts:['lotus','mercy']},
    wudang:{name:'무당',roleList:['blade','guard','heal','hex','bow','hex','blade','bow'],arts:['wall','silence']}
  };
  const newMembers=['강현','연강','설아','도화','진연','한묵','연진','소하'];
  const rivalNames={
    tang:['당무결','당석건','당월하','당적련','당한조','당야귀','당우강','당유설'],
    shaolin:['혜명','법산','명월','원각','지운','무진','법현','혜광'],
    wudang:['청현','원진','설운','자허','담송','무진','청하','백학']
  };
  const playerTeam=(key='balanced')=>roster.map((f,i)=>{
    const role=playerPresets[key].roleList?.[i];
    return role&&role!==f.role?{id:i+(key==='hold'?40:60),name:newMembers[i],role}:{...f};
  });
  function enemyTeam(key,terrain,mode=8){
    if(mode!==8)return place(rivals.slice(0,mode),{front:Math.ceil(mode/2)});
    return place(rivals.map((f,i)=>({...f,name:rivalNames[key][i],role:foesPresets[key].roleList[i]})),terrain);
  }
  const defaults = {guard:'ward',blade:'sword',bow:'arrow',hex:'curse',heal:'mend',dash:'link'};
  const usedSkill = {guard:['ward','sword'],blade:['sword','link'],bow:['arrow','link'],hex:['curse','arrow'],heal:['mend','ward','sword'],dash:['link','sword']};
  const commandRules={captainShield:12,defenseCaptainShield:20,moraleLoss:.14,deputyShield:18,deputyHeal:.28};
  function leadershipPreview({team,mode,captain,deputy,scenario,loadout,chosenArts}){
    const group=mode===8;
    const describe=(key,id)=>{
      const member=team.find(u=>u.id===id);
      if(!member)return null;
      const usesHeal=(group?usedSkill[member.role]:loadout).includes('mend');
      const baseHeal=(group?25:37)*(member.role==='heal'?1.15:1);
      const keys=key==='captain'?['swordlight','turtle','escort']:['swordlight','medic','wedge'];
      return {
        name:member.name,line:member.line,role:roles[member.role].name,hp:roles[member.role].hp,
        startingShield:group?(scenario==='defense'?commandRules.defenseCaptainShield:commandRules.captainShield):0,
        moraleLoss:Math.round(commandRules.moraleLoss*100),deputyShield:group?commandRules.deputyShield:0,
        healed:usesHeal?[Math.round(baseHeal),Math.round(baseHeal*(1+commandRules.deputyHeal))]:null,
        artLinks:group?chosenArts.filter(art=>keys.includes(art)).map(art=>arts[art]):[]
      };
    };
    return {captain:describe('captain',captain),deputy:describe('deputy',deputy)};
  }
  const TICK=.15;
  const active=(g,side)=>g.units.filter(u=>u.side===side&&u.hp>0);
  const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const frontOrder = ['guard','blade','dash','hex','bow','heal'];
  function place(team,terrain) {
    const sorted=[...team].sort((a,b)=>frontOrder.indexOf(a.role)-frontOrder.indexOf(b.role));
    return sorted.map((u,i)=>({...u,line:i<terrain.front?'front':'back'}));
  }
  function unit(f,side,i,count,terrain,mode) {
    const role=roles[f.role], front=f.line==='front';
    const lane=front&&mode===8?(terrain.y[i]??.5):.18+.64*(i+1)/(count+1);
    const x=side? (front?582:708):(front?318:192);
    return {...f,side,slot:i,x,y:lane*430,homeX:x,homeY:lane*430,hp:role.hp,max:role.hp,
      prevX:x,prevY:lane*430,shield:0,weak:0,mark:0,exposed:0,tauntUntil:0,tauntAt:1.5,stun:0,mods:{},
      actAt:-10,attackAt:-10,hitAt:-10,breachedAt:-10,facing:side?-1:1,cd:side?.02*i:.08*i,actions:0};
  }
  function create({team, terrain='field', mode=8, captain, deputy, scenario='attack', loadout, chosenArts=baseArts, opponent='tang'}) {
    const t=terrains[terrain];
    const enemy=enemyTeam(opponent,t,mode);
    if(mode===1) enemy[0].line='front';
    const make=(members,side)=>['front','back'].flatMap(line=>{
      const group=members.filter(f=>f.line===line);
      return group.map((f,i)=>unit(f,side,i,group.length,t,mode));
    });
    const g={t,terrain,mode,scenario,time:0,ticks:0,units:[...make(team,0),...make(enemy,1)],
      loadout, leaders:[{captain,deputy},{captain:20,deputy:21}],
      fronts:[{x:390,broken:false},{x:510,broken:false}], effects:[],log:[],milestones:[],
      round:1,turn:0,order:[],winner:null,finished:false,reason:''};
    g.opponent=opponent;g.sectNames=[sects[0],mode===8?foesPresets[opponent].name:'적련회'];
    g.arts=[Array.from(new Set(chosenArts.filter(k=>arts[k]))).slice(0,2),foesPresets[opponent].arts];
    g.lanes=[0,1].map(side=>t.y.map((y,index)=>({y:y*430,open:false,
      units:g.units.filter(u=>u.side===side&&u.line==='front'&&u.slot===index).map(u=>u.id)})));
    g.skillCounts=[{},{}];g.taunts=[0,0];g.rearStrikes=[0,0];
    g.artEvents=[];g.used=[new Set(),new Set()];g.wounds=[[],[]];
    g.initial=[0,1].map(side=>active(g,side).length);
    g.frontMax=[0,1].map(side=>active(g,side).filter(u=>u.line==='front').reduce((sum,u)=>sum+u.max,0));
    if(mode!==8) nextRound(g);
    else {
      for(const u of g.units) if(u.id===g.leaders[u.side].captain)
        u.shield=scenario==='defense'&&u.side===0?commandRules.defenseCaptainShield:commandRules.captainShield;

  const fixedArts=['rain','poison'];

  const ranged=u=>['bow','hex'].includes(u.role);

  function buff(g,u,key,seconds,value=1){

  function mod(g,u,key){
    const item=u.mods[key];

  function lifeLoss(g,v,amount){

  function hit(g,v,amount,attacker,{pierce=false}={}){

  function artContext(g,side){

      case 'medic':return deputy&&ratio(deputy)<=.4?[deputy,...own.filter(u=>u!==deputy).sort(low).slice(0,1)]:[];
      case 'revive':return own.length<g.initial[side]?[...own].sort(low).slice(0,2):[];

      case 'silence':return around(eBack.find(u=>u.cast),eBack);
      case 'fog':return g.time>=8?[...foes].sort((a,b)=>Math.abs(a.x-450)-Math.abs(b.x-450)).slice(0,6):[];
      case 'morale':return rivals.some(u=>ratio(u)<=.5)?foes:[];

        case 'wall':buff(g,u,'guarding',5,.35);break;

        case 'reflect':buff(g,u,'reflect',5,.25);break;

</script><script>const el=id=>document.getElementById(id);

            stroke(tx-20,ty-38,tx,ty,j%2?color:'#d8a6fb',2.5);
          }
          if(phase>.45)circle(x,y,7+(phase-.45)*54,color,false,2.5);
        }else if(event.kind==='defense'){
          circle(x,y,15+phase*33,color,false,3);
          ctx.beginPath();ctx.arc(x,y,23+phase*20,Math.PI,Math.PI*2);ctx.lineWidth=4;
          ctx.strokeStyle=color;ctx.stroke();
        }else if(event.kind==='heal'){
          circle(x,y,11+phase*35,color,false,2);
          for(let j=0;j<6;j++)circle(x+Math.sin(j*3.4)*18,y+5-phase*(33+j*5),2,color,true);
        }else if(event.kind==='control'){
          for(let j=0;j<6;j++){
            const a=j*Math.PI/3;
            stroke(x,y,x+Math.cos(a)*30,y+Math.sin(a)*25,color,2);
          }
          circle(x,y,18+phase*20,color,false,2);
        }else{
          const dx=event.side?-1:1, length=24+37*phase;
          const rise=event.key==='wing'?(y<215?-32:32):0;
          const toward=event.key==='withdraw'?-dx:dx;
          const tx=x+length*toward,ty=y+rise;
          stroke(x,y,tx,ty,color,4);
          stroke(tx,ty,tx-toward*13,ty-9,color,4);
          stroke(tx,ty,tx-toward*13,ty+9,color,4);
        }
      }
    }
    ctx.restore();
  }
}

function stroke(x,y,tx,ty,color,width=1){

function circle(x,y,r,color,fill=false,width=2){

function text(value,x,y,size,color){

function ground(){
  const bg=ctx.createLinearGradient(0,0,900,430);

  ctx.fillStyle=bg;ctx.fillRect(0,0,900,430);

  ctx.strokeStyle='#f7e2b714';ctx.lineWidth=1;
  for(let x=0;x<900;x+=30)stroke(x,0,x,430,'#f7e2b714');
  for(let y=0;y<430;y+=30)stroke(0,y,900,y,'#f7e2b714');
  ctx.fillStyle='#160f1430';ctx.fillRect(0,0,245,430);ctx.fillRect(655,0,245,430);
  if(terrainKey!=='field'){
    ctx.fillStyle=terrainKey==='river'?'#305865':'#65655b';ctx.fillRect(431,0,38,430);
    for(const y of terrains[terrainKey].y){ctx.fillStyle='#a18c63';ctx.fillRect(414,y*430-9,72,18);}
  }
  for(const [x,label] of [[130,'아군 후열'],[322,'아군 전열'],[578,'적군 전열'],[770,'적군 후열']])
    text(label,x,31,13,'#e6d6b7');
}
function frontLines(){
  const fronts=game?.fronts||[{x:390},{x:510}];
  fronts.forEach((front,side)=>{
    const color=front.broken?'#ff7162':side?'#ffa583':'#9ae6bb';
    ctx.setLineDash(front.broken?[11,13,3,13]:[4,7]);
    const x=front.x+(front.broken?Math.sin(visualTime*35)*4:0);
    for(let y=52;y<400;y+=21){
      const opening=game?.lanes[side].some(lane=>lane.open&&Math.abs(lane.y-y-8)<23);
      if(!opening)stroke(x,y,x+Math.sin(y*.034)*6,y+17,color,front.broken?3:2);
    }
    ctx.setLineDash([]);
    for(const lane of game?.lanes[side]||[]){
      if(!lane.open)continue;
      stroke(x-9,lane.y,x+9,lane.y,'#fc9b70',2);
      circle(x,lane.y,5,'#fc9b70');

    text(front.broken?'전선 붕괴':'전선',x,416,12,color);

const hues={strike:'#ffe1a5',arrow:'#ffd079',hex:'#db9dff',heal:'#83ffb1',shield:'#8acbff',link:'#ffa080',breach:'#ff5447',miss:'#dce5db',taunt:'#ffc580',ambush:'#ff8bac',trail:'#d9a7fa'};
function effects(now){
  if(!game)return;
  for(const e of game.effects){
    const age=now-e.at;
    if(age<0||age>1.1)continue;
    const color=hues[e.kind];
    ctx.save();ctx.globalAlpha=Math.max(0,1-age/1.15);ctx.shadowColor=color;ctx.shadowBlur=14;
    if(e.kind==='miss'){text('빗나감',e.tx,e.ty-28-age*14,13,color);
    }else if(e.kind==='trail'){
      ctx.globalAlpha*=Math.max(0,1-age/.55)*.55;
      const u=game.units.find(unit=>unit.id===e.actor);
      if(u)sprite(u,e.tx,e.ty,.8);
      stroke(e.x,e.y,e.tx,e.ty,color,4);
    }else if(e.kind==='taunt'){
      circle(e.x,e.y,25+age*75,color,false,3);
      ctx.setLineDash([4,5]);stroke(e.x,e.y,e.tx,e.ty,color,2);ctx.setLineDash([]);
    }else if(e.kind==='ambush'){
      stroke(e.x-10,e.y+9,e.tx+13,e.ty-14,color,4);
      stroke(e.x-4,e.y-16,e.tx+10,e.ty+9,'#ffe4d4',3);
      circle(e.tx,e.ty,12+age*24,color);
    }else if(e.kind==='arrow'){
      const p=Math.min(1,age/.33),x=e.x+(e.tx-e.x)*p,y=e.y+(e.ty-e.y)*p;
      stroke(x-(e.tx-e.x)*.13,y-(e.ty-e.y)*.13,x,y,color,3);circle(x,y,4,color,true);
      if(p===1)circle(e.tx,e.ty,8+age*18,color);

      const angle=Math.atan2(e.ty-e.y,e.tx-e.x);
      ctx.setLineDash([9,6]);stroke(e.x,e.y,e.tx,e.ty,color,4);ctx.setLineDash([]);
      stroke(e.tx,e.ty,e.tx-20*Math.cos(angle-.48),e.ty-20*Math.sin(angle-.48),color,4);
      stroke(e.tx,e.ty,e.tx-20*Math.cos(angle+.48),e.ty-20*Math.sin(angle+.48),color,4);
    }else if(e.kind==='strike'||e.kind==='link'){
      ctx.beginPath();ctx.arc(e.tx,e.ty,15+age*31,-.95,1.34);ctx.strokeStyle=color;ctx.lineWidth=5;ctx.stroke();
      stroke(e.tx-17,e.ty+12,e.tx+19,e.ty-14,color,2);
      if(e.kind==='link')circle(e.tx,e.ty,9+age*39,color);
    }else{
      stroke(e.x,e.y,e.tx,e.ty,color,e.kind==='heal'?2:1);
      circle(e.tx,e.ty,13+age*35,color,false,e.kind==='shield'?4:2);
      circle(e.tx,e.ty,6+age*26,color);
      if(e.kind==='hex')text('封',e.tx,e.ty+7,20,color);

    ctx.shadowBlur=0;

       game.effects.findLast(other=>other.actor===e.actor&&other.at===e.at)===e)

}

    }
  }

}

const portraits=Object.fromEntries(Object.entries(cardArtwork).map(([role,src])=>{
  const image=new Image();image.src=src;return [role,image];
}));
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
const cardMotion=(u,now,enabled)=>{
  const attack=now-(u.attackAt??-10),hit=now-u.hitAt,breach=now-(u.breachedAt??-10);
  return {
    lunge:enabled&&u.hp&&attack>=0&&attack<.24 ? (u.side?-1:1)*Math.sin(attack/.24*Math.PI)*12 : 0,
    shake:enabled&&u.hp&&hit>=0&&hit<.26 ? Math.sin(hit*83)*(1-hit/.26)*4 : 0,
    flash:u.hp&&hit>=0&&hit<.32 ? (1-hit/.32)*.72 : 0,
    breach:u.hp&&u.exposed>now,
    pulse:enabled&&u.hp&&breach>=0&&breach<1.1 ? (.5-.5*Math.cos(breach/1.1*4*Math.PI))*(1-breach/1.3) : 0
  };
};
function card(u,x,y,leader,now){
  const captain=u.id===leader.captain, deputy=u.id===leader.deputy;
  const motion=cardMotion(u,now,!reducedMotion.matches);
  const large=(game?.mode||mode)!==8;
  const width=(large?52:40)*(captain?1.07:1),height=(large?62:47)*(captain?1.07:1);
  const center=x+motion.lunge, top=y-height+9+(u.hp?0:4);
  const left=center-width/2;
  const border=!u.hp?'#77847a':motion.breach?'#ff675d':captain?'#f4c76c':deputy?'#7dc9ff':u.side?'#e1866d':'#8cbe9f';
  ctx.save();
  ctx.globalAlpha=u.hp?1:.60;
  ctx.fillStyle='#142019';
  ctx.beginPath();ctx.roundRect(left,top,width,height,5);ctx.fill();
  ctx.save();
  ctx.clip();
  const image=portraits[u.role];
  if(image?.complete&&image.naturalWidth){
    ctx.translate(center+motion.shake,top);
    if(u.side)ctx.scale(-1,1);
    if(!u.hp)ctx.filter='grayscale(100%) brightness(48%)';
    // Bleed past the clip so the shake never reveals an empty card edge.
    ctx.drawImage(image,-width/2-4,-2,width+8,height+4);
  }else{
    text(roles[u.role].icon,center,top+height*.62,19,border);
  }
  ctx.restore();
  if(motion.flash){
    const flash=ctx.createLinearGradient(left,0,left+width,0);
    flash.addColorStop(0,'rgba(255,54,54,'+motion.flash+')');
    flash.addColorStop(.16,'#ff454500');flash.addColorStop(.84,'#ff454500');
    flash.addColorStop(1,'rgba(255,54,54,'+motion.flash+')');
    ctx.fillStyle=flash;
    ctx.beginPath();ctx.roundRect(left,top,width,height,5);ctx.fill();
  }
  ctx.strokeStyle=border;ctx.lineWidth=captain||deputy||motion.breach?2:1;
  if(captain&&u.hp||motion.pulse){ctx.shadowColor=border;ctx.shadowBlur=motion.pulse?7+motion.pulse*9:7;}
  ctx.beginPath();ctx.roundRect(left,top,width,height,5);ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle='#121815';ctx.fillRect(left,top-5,width,3);
  if(u.hp){ctx.fillStyle=u.side?'#ff9d7d':'#a1e1b8';ctx.fillRect(left,top-5,width*u.hp/u.max,3);}
  if((captain||deputy)&&u.hp)text(captain?'대장':'부대장',center,top-8,10,captain?'#ffdd8b':'#a9d9fe');
  text(u.name,center,top+height+12,11,u.side?'#ffb298':'#cbe5ce');
  ctx.restore();
}

function draw(){
  ground();
  artEffects(wallClock);
  if((game?.mode||mode)===8)frontLines();
  const preview=()=>({...Arena.create({team:lineup,terrain,mode,captain,deputy,loadout,opponent}), previewKey:JSON.stringify([lineup,terrain,mode,captain,deputy,loadout,opponent])});
  const view=game||idle|| (idle=preview());
  for(const u of [...view.units].sort((a,b)=>a.y-b.y)){
    const blend=game?.mode===8&&!game.finished?Math.min(1,elapsed/Arena.TICK):1;
    const x=u.prevX+(u.x-u.prevX)*blend,y=u.prevY+(u.y-u.prevY)*blend;
    if(u.shield>0||(u.barrier?.hp>0&&u.barrier.until>view.time))circle(x,y-10,24,'#94d4ff',false,2);
    card(u,x,y,view.leaders[u.side],game?visualTime:0);
    if(u.cast&&!game?.finished){
      ctx.fillStyle='#191724';ctx.fillRect(x-15,y+24,30,3);
      ctx.fillStyle='#d6b0ff';ctx.fillRect(x-15,y+24,30*Math.max(0,1-(u.cast.until-view.time)/.45),3);
    }
    if(game&&u.hp&&u.tauntUntil>game.time){
      const guard=game.units.find(f=>f.id===u.tauntedBy&&f.hp);
      if(guard){stroke(x,y+8,guard.x,guard.y+8,'#ffc580ad',1);text('도발',x,y+38,13,'#ffc580');}
    }else if(game&&u.hp&&u.stun>game.time)text('행동 중단!',x,y+38,13,'#ff9aae');
    else if(game&&u.hp&&u.exposed>game.time)text(u.role==='bow'?'사수 노출!':'후열 침투!',x,y+46,13,'#ff967d');
    else if(game&&u.hp&&u.weak>game.time)text('방어력 감소!',x,y+46,12,'#e1b3ff');
    else if(game&&u.last==='heal'&&game.effects.some(e=>e.tx===u.x&&e.ty===u.y&&e.kind==='heal'&&visualTime-e.at<.65))
      text('체력 회복!',x,y+46,12,'#a9ffc6');
  }
  ctx.globalAlpha=1;
  effects(visualTime);
  const recentAlarms=game?.milestones.filter(row=>visualTime-row.time<2.5)||[];
  const alarm=recentAlarms.findLast(row=>row.type==='break'&&visualTime-row.time<1.05)||recentAlarms.findLast(row=>['break','infiltrate'].includes(row.type));
  el('alarm').hidden=!alarm;
  if(alarm)el('alarm').textContent=alarm.type==='break'?'⚠ '+alarm.text.split('!')[0]+'!':'⚠ 후열 침투!';
}
let idle=null;
function frame(now){
  wallClock=now;
  const delta=Math.min(.1,(now-(last||now))/1000);last=now;
  if(game&&game.mode===8&&!game.finished){
    elapsed+=delta*(now<slowUntil?.2:speed);
    while(elapsed>=Arena.TICK&&!game.finished){
      Arena.tick(game);elapsed-=Arena.TICK;refresh();
      const previous=seenArts;readArtEvents(now);
      if(previous!==seenArts)break;
    }
    visualTime=game.time+elapsed;
  }else if(game&&game.mode!==8&&!game.finished){
    if(Arena.current(game).side===1&&now>=enemyAt){Arena.enemyTurn(game);visualTime=game.time;enemyAt=now+350/speed;refresh();}
    visualTime=Math.max(game.time,visualTime+delta*speed);
  }else visualTime+=delta*speed;
  if(!game&&idle?.previewKey!==JSON.stringify([lineup,terrain,mode,captain,deputy,loadout,opponent]))idle=null;
  renderCutins(now);draw();requestAnimationFrame(frame);
}
setup();refresh();requestAnimationFrame(frame);
</script>
